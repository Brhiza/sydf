name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 运行测试
        run: pnpm test
      - name: 构建生产版本
        run: pnpm build
